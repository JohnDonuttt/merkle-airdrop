[package]
name = "merkle-airdrop"
version = "0.1.0"
edition = "2021"
description = "Build and verify Merkle trees for token airdrops, compatible with OpenZeppelin's MerkleProof"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
proptest = "1"
